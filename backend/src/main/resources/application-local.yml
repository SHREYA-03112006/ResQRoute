# ResQ-Route — Local / Offline Profile
# Used for running without local Docker / PostgreSQL daemon running
spring:
  datasource:
    url: jdbc:h2:mem:resqroute_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    com.resqroute: DEBUG
